<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Jeu Tux</title>
        <link rel="stylesheet" href="jeu.css">
    </head>
    <body>
        <main class="jeu">
            <div class="modes">
                <button class="mode actif" data-mode="ia" type="button">Contre l'IA</button>
                <button class="mode" data-mode="deux" type="button">2 joueurs</button>
            </div>

            <div class="choix-duree">
                <label for="duree">Durée de la partie</label>
                <select id="duree">
                    <option value="15">15 secondes</option>
                    <option value="30" selected>30 secondes</option>
                    <option value="45">45 secondes</option>
                    <option value="60">60 secondes</option>
                </select>
            </div>

            <div class="infos">
                <span>Tux (J1) <b id="score-j1">0</b></span>
                <span><span id="titre-score">IA (tireur)</span> <b id="score">0</b></span>
                <span>Temps restant (s) <b id="temps">30</b></span>
            </div>

            <div class="zone-jeu">
                <div class="plateau">
                    <div id="cadre" tabindex="0" aria-label="Zone du jeu Tux">
                        <img id="tux" src="tux.png" alt="Tux">
                        <p id="game-over">Terminé</p>
                    </div>

                    <div class="commandes">
                        <button id="commencer" type="button">Commencer</button>
                    </div>
                </div>

                <aside class="aide-jeu">
                    <h2>Comment jouer ?</h2>

                    <p id="instruction">
                        Déplace Tux avec les flèches du clavier
                        et évite les taches lancées automatiquement.
                    </p>

                    <div class="bareme">
                        <p><strong>Tux</strong> +2 par esquive</p>
                        <p><strong>Tireur</strong> +15 par touche</p>
                    </div>
                </aside>
            </div>
        </main>
        <script src="jeu.js"></script>
    </body>
</html>
